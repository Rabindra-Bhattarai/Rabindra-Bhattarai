<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="raw-lakehouse data flow: MySQL to Debezium to Redpanda to Spark to Iceberg to Trino and dbt to Superset">
  <style>
    .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
    .n{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .lbl{fill:#e6edf3;font-size:13px;font-weight:700}
    .sub{fill:#8b949e;font-size:11px}
    .e{stroke:#30363d;stroke-width:2;fill:none}
    .d{fill:#3fb950}
  </style>
  <rect x="0.5" y="0.5" width="899" height="189" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="32" class="m" style="fill:#3fb950;font-size:12px">● LIVE</text>
  <text x="80" y="32" class="m" style="fill:#8b949e;font-size:12px">raw-lakehouse · real-time CDC · exactly-once</text>

  <path class="e" d="M44 110 H856"/>
  <g>
    <circle r="4" class="d"><animateMotion dur="4s" repeatCount="indefinite" path="M116 110 H764"/></circle>
    <circle r="4" class="d" opacity=".7"><animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M116 110 H764"/></circle>
    <circle r="4" class="d" opacity=".45"><animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M116 110 H764"/></circle>
  </g>
  <g class="m" text-anchor="middle">
    <rect class="n" x="20"  y="84" width="96" height="52" rx="8"/><text x="68"  y="106" class="lbl">MySQL</text><text x="68"  y="124" class="sub">source</text>
    <rect class="n" x="144" y="84" width="96" height="52" rx="8"/><text x="192" y="106" class="lbl">Debezium</text><text x="192" y="124" class="sub">capture</text>
    <rect class="n" x="268" y="84" width="96" height="52" rx="8"/><text x="316" y="106" class="lbl">Redpanda</text><text x="316" y="124" class="sub">stream</text>
    <rect class="n" x="392" y="84" width="96" height="52" rx="8"/><text x="440" y="106" class="lbl">Spark</text><text x="440" y="124" class="sub">process</text>
    <rect class="n" x="516" y="84" width="96" height="52" rx="8"/><text x="564" y="106" class="lbl">Iceberg</text><text x="564" y="124" class="sub">store</text>
    <rect class="n" x="640" y="84" width="96" height="52" rx="8"/><text x="688" y="106" class="lbl">Trino+dbt</text><text x="688" y="124" class="sub">model</text>
    <rect class="n" x="764" y="84" width="116" height="52" rx="8" style="stroke:#3fb950"/><text x="822" y="106" class="lbl">Superset</text><text x="822" y="124" class="sub">insight</text>
  </g>
  <text x="24" y="168" class="m" style="fill:#8b949e;font-size:11px">every row change → queryable in seconds · schema-change safe · runs locally in Docker</text>
</svg>
