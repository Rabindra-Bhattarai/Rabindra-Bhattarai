<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Rabindra Bhattarai as a dbt lineage graph. Sources: Coventry University, Python and SQL, curiosity about fintech, 1,600 contributions. Models: raw-lakehouse, payments-pipeline (building), customer-segmentation, churn-prediction, hospital-intelligence, Ask-My-Docs. Exposures: junior data engineer, then fintech data engineer.">
<style>
.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
